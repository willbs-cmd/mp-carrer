name: MP Career app checks

on:
  push:
    paths:
      - "**.py"
      - "assets/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/mp-career-check.yml"
  pull_request:
    paths:
      - "**.py"
      - "assets/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/mp-career-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile app and game logic
        run: python -m py_compile app.py career.py saves.py achievements.py content_store.py
      - name: Run tests (gameplay, data, saves, achievements, UI smoke render)
        run: python -m unittest discover -s tests -v
