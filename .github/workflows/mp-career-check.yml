name: MP Career app checks

on:
  push:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/mp-career-check.yml"
  pull_request:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/mp-career-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile app and game logic
        run: python -m py_compile app.py career.py content_store.py
      - name: Test MP career gameplay
        run: python -m unittest discover -s tests -v
      - name: Validate JSON data
        run: python -c "import json,pathlib; root=pathlib.Path('data'); files=list(root.glob('*.json')); data={p.name:json.loads(p.read_text(encoding='utf-8')) for p in files}; geo=json.loads((root/'constituencies_2024.geojson').read_text(encoding='utf-8')); assert len(data['constituencies_2024.json']['constituencies']) == 650; assert len(geo['features']) == 650; assert len(data['career_divisions.json']['divisions']) >= 15; comp=data['parliament_composition_2026-10-26.json']; assert sum(x['seats'] for x in comp['commons']['seats']) == 650; assert sum(x['seats'] for x in comp['lords']['seats']) == 797; print(f'Validated {len(files)} JSON files and 650 constituency shapes')"
