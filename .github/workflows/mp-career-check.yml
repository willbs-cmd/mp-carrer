name: MP Career app checks

on:
  push:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/mp-career-check.yml"
  pull_request:
    paths:
      - "**.py"
      - "data/**"
      - ".github/workflows/mp-career-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Compile app and game logic
        run: python -m py_compile app.py career.py content_store.py
      - name: Test MP career gameplay
        run: python -m unittest discover -s tests -v
      - name: Validate JSON data
        run: python -c "import json,pathlib; files=list(pathlib.Path('data').glob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; assert len(json.loads(pathlib.Path('data/constituencies_2024.json').read_text(encoding='utf-8'))['constituencies']) == 650; assert len(json.loads(pathlib.Path('data/career_divisions.json').read_text(encoding='utf-8'))['divisions']) >= 15; print(f'Validated {len(files)} JSON data files')"
